.stockl{margin:10px 0 0;font-size:14px;font-weight:700}

.citem img,.citem .noimg{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--chip)}
.citem .noimg svg{width:28px;height:28px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.ctotal{display:flex;justify-content:space-between;font-size:20px;font-weight:800;padding:14px 0 4px;font-variant-numeric:tabular-nums}
.lnkbtn{background:none;border:0;color:var(--danger);font:inherit;font-size:13px;cursor:pointer;padding:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--chip);border-radius:14px;padding:12px 14px}
.kpi span{display:block;font-size:13px;color:var(--muted)}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;padding-top:8px}
.bars div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.barl{display:flex;gap:4px;font-size:10px;color:var(--muted)}
.barl span{flex:1;text-align:center}
.toplist{list-style:none;margin:0;padding:0}
.toplist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.lablist{display:flex;flex-direction:column;max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.lablist label{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500;font-size:15px}
.lablist input{width:20px;height:20px;accent-color:var(--field);flex:none}
.vrow{display:grid;grid-template-columns:1fr 110px 36px;gap:8px;align-items:end}
.vrow button{height:48px;border:0;background:none;color:var(--danger);font-size:24px;cursor:pointer}
.insthint{font-size:13px;color:var(--muted);margin:0 0 8px}
#print{display:none}
.lab{border:1px dashed #999;height:38mm;padding:3mm;display:grid;grid-template-columns:1fr 22mm;gap:2mm;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;break-inside:avoid;overflow:hidden;box-sizing:border-box}
.lab .ln{font-weight:700;font-size:10pt;line-height:1.15;max-height:2.35em;overflow:hidden}
.lab .lp{font-weight:800;font-size:17pt;line-height:1;margin-top:2mm}
.lab .lp small{font-size:7.5pt;font-weight:700}
.lab .ls{font-size:7pt;color:#333;margin-top:1.2mm}
.lab svg{width:22mm;height:22mm;align-self:center}
@media print{@page{size:A4;margin:8mm}html,body{background:#fff!important}body::before{display:none}#root,.cartfab{display:none!important}#print{display:grid!important;grid-template-columns:repeat(3,1fr)}}

function stockTracked(p){return p.stock!==''&&p.stock!=null&&!isNaN(Number(p.stock))}
function isOut(p){return !!p.out||(stockTracked(p)&&Number(p.stock)<=0)}
function lowStock(p){return stockTracked(p)&&Number(p.stock)>0&&Number(p.stock)<=5}
function hasVar(p){return Array.isArray(p.variants)&&p.variants.length>0}
function minVar(p){return Math.min.apply(null,p.variants.map(function(v){return Number(v.price)||0}))}
function dropped(p){var h=p.history||[];if(!h.length)return false;var l=h[h.length-1];return Number(l.price)>Number(p.price)&&days(p.priceDate)<=7}
var CART={};try{CART=JSON.parse(localStorage.getItem('jq-cart')||'{}')||{}}catch(_){CART={}}
function saveCart(){try{localStorage.setItem('jq-cart',JSON.stringify(CART))}catch(_){}}
function cartItems(){var out=[];Object.keys(CART).forEach(function(k){var a=k.split('|'),p=byId(a[0]);if(!p){if(LOADED)delete CART[k];return}
  var vi=a[1]===''?null:+a[1],v=hasVar(p)&&vi!=null?p.variants[vi]:null;if(hasVar(p)&&!v){delete CART[k];return}
  var q=CART[k],u=v?Number(v.price):eff(p),ws=false;if(!v&&Number(p.wsMin)>0&&Number(p.wsPrice)>0&&q>=Number(p.wsMin)){u=Number(p.wsPrice);ws=true}
  out.push({k:k,p:p,v:v,q:q,unit:u,ws:ws,sum:u*q})});return out}
function cartCount(){return Object.keys(CART).reduce(function(s,k){return s+(CART[k]||0)},0)}
function fabHTML(){var n=cartCount();if(!n)return '';return '<button class="cartfab" data-act="cart" aria-label="Savatcha">'+I.cart+'Savatcha <b>'+n+'</b></button>'}
function tgLink(msg){var tg=String((DATA.store||{}).telegram||'').replace(/^@/,'');return tg?'https://t.me/'+encodeURIComponent(tg)+'?text='+encodeURIComponent(msg):''}
function plainMoney(n){return money(n).replace(/\u00a0/g,' ')}
function prodURL(p){return location.origin+location.pathname+'#'+p.id}

function he(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function tgReady(){return !!(C.tg&&C.tg.token&&C.tg.chat)}
function tgCall(method,fd){
  return fetch('https://api.telegram.org/bot'+C.tg.token+'/'+method,{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.description||'Telegram xatosi');return j})
  .catch(function(e){if(e&&e.name==='TypeError')return {ok:true,unsure:true};throw e});
}
function tgCaption(p){
  var c=CATMAP[catOf(p)],u=p.unit?' / '+p.unit:'',L=['<b>'+he(p.name)+'</b>',''];
  if(hasVar(p))p.variants.forEach(function(v){L.push(he(v.name)+': <b>'+plainMoney(v.price)+' so‘m</b>'+he(u))});
  else if(onSale(p))L.push('Narxi: <s>'+plainMoney(p.price)+'</s> <b>'+plainMoney(p.salePrice)+' so‘m</b>'+he(u)+' (aksiya −'+pct(p)+'%)');
  else L.push('Narxi: <b>'+plainMoney(p.price)+' so‘m</b>'+he(u));
  if(Number(p.wsMin)>0&&Number(p.wsPrice)>0)L.push('Ulgurji: '+he(p.wsMin)+' '+he(p.unit||'dona')+'dan ko‘p — '+plainMoney(p.wsPrice)+' so‘m');
  if(p.note)L.push('',he(p.note));
  L.push('','Bo‘lim: '+he(c.n));
  var ph=(DATA.store.phones||[]).map(fphone);if(ph.length)L.push('Tel: '+ph.join(', '));
  L.push('<a href="'+he(prodURL(p))+'">Saytda ko‘rish va buyurtma berish</a>');
  var s=L.join('\n');return s.length>1000?s.slice(0,990)+'…':s;
}
function dataToBlob(u){return fetch(u).then(function(r){return r.blob()})}
function tgPost(p){
  if(!tgReady())return Promise.reject(new Error('Telegram kanal sozlanmagan («Do‘kon ma’lumotlari» bo‘limida).'));
  return loadPhotos(p).then(function(){
    var srcs=(p.photos||[]).map(srcOf).filter(Boolean).slice(0,10),cap=tgCaption(p);
    if(!srcs.length){var fd=new FormData();fd.append('chat_id',C.tg.chat);fd.append('text',cap);fd.append('parse_mode','HTML');return tgCall('sendMessage',fd)}
    return Promise.all(srcs.map(dataToBlob)).then(function(blobs){
      var fd=new FormData();fd.append('chat_id',C.tg.chat);
      if(blobs.length===1){fd.append('photo',blobs[0],'p.jpg');fd.append('caption',cap);fd.append('parse_mode','HTML');return tgCall('sendPhoto',fd)}
      fd.append('media',JSON.stringify(blobs.map(function(b,i){var m={type:'photo',media:'attach://f'+i};if(!i){m.caption=cap;m.parse_mode='HTML'}return m})));
      blobs.forEach(function(b,i){fd.append('f'+i,b,'f'+i+'.jpg')});
      return tgCall('sendMediaGroup',fd);
    });
  });
}

function photoSearch(file){
  loadImg(file).then(function(img){
    var url=resize(img,200).toDataURL('image/jpeg',.8),v=vecOf(img);
    var local=DATA.products.map(function(p){var best=1;(p.photos||[]).forEach(function(x){if(x.vec)best=Math.min(best,vecDist(v,x.vec))});return {p:p,d:best}})
      .filter(function(r){return r.d<1}).sort(function(a,b){return a.d-b.d}).slice(0,6)
      .map(function(r){return {p:r.p,label:'O‘xshashlik: '+Math.max(0,Math.round((1-r.d*2.2)*100))+'%'}});
    S.photo={url:url,results:local,status:DATA.products.length?(C.sampleImages?'Rasm aniqlanmoqda…':'Rang va ko‘rinishi bo‘yicha eng yaqin mahsulotlar'):'Bazada hali mahsulot yo‘q'};
    go('list');
    if(!C.sampleImages||!DATA.products.length)return;
    var names=DATA.products.slice(0,600).map(function(p){return p.id+' | '+p.name+(p.note?' ('+p.note+')':'')}).join('\n');
    toBlob(resize(img,1024),.85).then(function(blob){
      return C.sample.json('Sen qishloq xo‘jalik va xo‘jalik mollari do‘konida yordamchisan. Rasmda qaysi mahsulot borligini aniqla va quyidagi ro‘yxatdan eng mos keladiganlarini tanla (ko‘pi bilan 4 ta, eng moslari birinchi). Hech biri mos kelmasa ids bo‘sh bo‘lsin.\n\nRo‘yxat (id | nomi):\n'+names+'\n\nFaqat JSON qaytar: {"seen":"rasmda nima borligi, o‘zbekcha, qisqa","ids":["..."]}',{images:[blob],modelTier:'quick',cache:false});
    }).then(function(r){
      if(!S.photo)return;
      var got=((r&&r.ids)||[]).map(byId).filter(Boolean),seen=r&&r.seen?'Rasmda: '+r.seen:'';
      if(got.length){var rest=S.photo.results.filter(function(x){return got.indexOf(x.p)<0});S.photo.results=got.map(function(p,i){return {p:p,label:i===0?'Eng mos':'Mos kelishi mumkin'}}).concat(rest.slice(0,2))}
      S.photo.status=seen+(got.length?'':(seen?' — ':'')+'Aniq moslik topilmadi, o‘xshashlari ko‘rsatildi');
      renderList();
    }).catch(function(){if(S.photo){S.photo.status='Rang va ko‘rinishi bo‘yicha eng yaqin mahsulotlar';renderList()}});
  }).catch(function(er){S.msg=er.message;render()});
}

render();
if(FBOK){
  auth.onAuthStateChanged(function(u){var em=u?String(u.email).toLowerCase():'';C.canEdit=!!u&&(!CFG.adminEmail||em===String(CFG.adminEmail).toLowerCase());C.seller=false;
    C.tg=null;C.tgErr='';
    if(C.canEdit)db.collection('secret').doc('telegram').get().then(function(t){C.tg=t.exists?t.data():null;if(!C.tg)C.tgErr='Telegram kanal hali sozlanmagan: «Do‘kon ma’lumotlari»da token va kanalni yozib, «Saqlash»ni bosing.';if(S.view==='detail'||S.view==='list')render()})
      .catch(function(e){C.tgErr='Telegram sozlamasini o‘qib bo‘lmadi: Firebase qoidalarida «secret» bo‘limi yo‘q. Rules’ni yangilang.';if(S.view==='list')render()});
    if(u)db.collection('staff').doc('list').get().then(function(d){var st=d.exists?d.data():{sellers:[]};if(C.canEdit){DATA.staff=st;SNAP.__staff=JSON.stringify(st)}else if((st.sellers||[]).indexOf(em)>-1){C.seller=true}if(S.view==='list'||S.view==='detail')render()}).catch(function(){if(C.canEdit){DATA.staff={sellers:[]};SNAP.__staff=JSON.stringify(DATA.staff)}});
    if(S.view==='list'||S.view==='detail')render()});
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){});
  Promise.all([db.collection('settings').doc('store').get(),db.collection('products').get()]).then(function(r){
    if(r[0].exists)DATA.store=r[0].data();
    DATA.products=r[1].docs.map(function(d){var p=d.data();p.id=d.id;return p});
    snapAll();LOADED=true;try{document.title=DATA.store.name+' — narxlar';TITLE0=document.title}catch(_){}
    var hid=(location.hash||'').slice(1);if(hid&&byId(hid)){S.sel=hid;S.vsel=0;countView(hid);S.view='detail'}
    render()}).catch(function(e){LOADERR='Internet aloqasini tekshirib, sahifani yangilang.';render()});
}
})();
